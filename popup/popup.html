<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Live Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Live Translator</h1>
    <p class="lead">YouTube LiveをローカルAIで文字起こしし、Chrome内蔵翻訳で日本語字幕にします。</p>

    <label>
      音声認識
      <select id="engineMode">
        <option value="auto">自動（ローカル優先 → Deepgram）</option>
        <option value="local">ローカルのみ（無料）</option>
        <option value="deepgram">Deepgramのみ</option>
      </select>
    </label>

    <section class="card" id="localCard">
      <div class="cardTitle">
        <span>ローカルエンジン</span>
        <span id="localBadge" class="badge offline">確認中</span>
      </div>

      <label>
        ローカルバックエンド
        <select id="localBackend">
          <option value="auto">自動（英語: FluidAudio / その他: Qwen3）</option>
          <option value="fluid">FluidAudio（英語・低遅延・話者分離）</option>
          <option value="qwen">Qwen3-ASR（多言語・専門用語context）</option>
        </select>
      </label>

      <label id="qwenModelLabel">
        Qwen3モデル
        <select id="localModel">
          <option value="moona3k/mlx-qwen3-asr-0.6b-4bit">Qwen3-ASR 0.6B 4-bit（推奨・約517MB）</option>
          <option value="moona3k/mlx-qwen3-asr-1.7b-4bit">Qwen3-ASR 1.7B 4-bit（高精度・約1.2GB）</option>
        </select>
      </label>

      <label class="checkLabel" id="diarizationLabel">
        <input id="diarization" type="checkbox">
        <span>話者分離（FluidAudio Sortformer）</span>
      </label>
      <p class="hint" id="diarizationHint">英語＋FluidAudio時に利用できます。話者ラベルは少し遅れて確定します。</p>

      <div class="localActions">
        <button id="startLocal" class="secondary">ローカルAI起動</button>
        <button id="testLocal">接続テスト</button>
        <button id="installModel">モデル準備</button>
      </div>

      <details>
        <summary>初回インストール / ローカルAI更新</summary>
        <p class="hint">Apple Silicon Mac用。v0.4ではFluidAudioのSwiftバイナリもビルドします。既存ユーザーも一度再実行してください。</p>
        <textarea id="installCommand" readonly rows="3"></textarea>
        <button id="copyInstall">コマンドをコピー</button>
      </details>
    </section>

    <label id="apiKeyLabel">
      Deepgram APIキー（フォールバック用）
      <input id="apiKey" type="password" autocomplete="off" placeholder="未設定でもローカルのみなら利用可">
    </label>

    <div class="grid">
      <label>
        音声言語
        <select id="sourceLanguage">
          <option value="en">英語</option>
          <option value="auto">自動検出</option>
          <option value="multi">多言語</option>
          <option value="ja">日本語</option>
          <option value="ko">韓国語</option>
          <option value="zh">中国語</option>
          <option value="es">スペイン語</option>
          <option value="fr">フランス語</option>
          <option value="de">ドイツ語</option>
        </select>
      </label>

      <label>
        翻訳先
        <select id="targetLanguage">
          <option value="ja">日本語</option>
          <option value="en">英語</option>
        </select>
      </label>
    </div>

    <label class="rangeLabel">
      <span>翻訳字幕サイズ <output id="translationSizeValue">100%</output></span>
      <input id="translationSize" type="range" min="70" max="180" step="10" value="100">
    </label>
    <p class="hint">70〜180%。変更は開いているYouTubeへ即時反映されます。</p>

    <label id="domainTermsLabel">
      固有名詞・専門用語
      <textarea id="domainTerms" rows="3" placeholder="OpenAI&#10;Anthropic&#10;Claude&#10;Cursor"></textarea>
    </label>
    <p class="hint" id="domainTermsHint">Qwen3-ASR使用時はcontextとして認識へ直接反映します。</p>

    <label id="endpointingLabel">
      Deepgram区切り
      <select id="endpointingMs">
        <option value="220">最速（220ms）</option>
        <option value="350" selected>バランス（350ms）</option>
        <option value="500">自然（500ms）</option>
      </select>
    </label>

    <div class="buttons">
      <button id="start" class="primary">翻訳開始</button>
      <button id="stop">停止</button>
    </div>

    <div id="status" class="status">停止中</div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
